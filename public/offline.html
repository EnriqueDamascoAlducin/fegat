<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#5b21b6" />
        <title>Sin conexión - FEGAT</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                padding: 1.5rem;
                box-sizing: border-box;
                background: #5b21b6;
                color: #fff;
                font-family: system-ui, sans-serif;
                text-align: center;
            }
            img {
                width: 96px;
                height: 96px;
                border-radius: 24px;
            }
            h1 {
                margin: 0;
                font-size: 1.5rem;
            }
            p {
                margin: 0;
                max-width: 28rem;
                opacity: 0.85;
            }
            button {
                border: 1px solid #fff;
                border-radius: 999px;
                background: transparent;
                color: #fff;
                padding: 0.6rem 1.4rem;
                font-size: 1rem;
            }
        </style>
    </head>
    <body>
        <img src="/icons/icon-192.png?v=2" alt="" />
        <h1>Sin conexión</h1>
        <p>
            El semáforo necesita internet para mostrar el resultado actual.
            Revisa tu conexión e inténtalo de nuevo.
        </p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </body>
</html>
